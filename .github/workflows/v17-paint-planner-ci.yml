name: V17 Paint Planner CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [v17-paint-planner-app]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Package latest V17 source
        run: git archive --format=zip --output=maalausmultivari-V17-latest.zip HEAD
      - name: Upload V17 project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: maalausmultivari-V17-latest
          path: maalausmultivari-V17-latest.zip
          if-no-files-found: error
          retention-days: 30
