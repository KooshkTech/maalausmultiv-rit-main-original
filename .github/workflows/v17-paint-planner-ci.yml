name: V20 Production Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify deployment essentials
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/.htaccess
          test -f CPANEL-DEPLOYMENT.md
          test -f TOOLS-AUDIT-REPORT.md

      - name: Package production dist contents
        run: |
          rm -f maalausmultivari-production-dist.zip
          cd dist
          zip -r ../maalausmultivari-production-dist.zip .
          cd ..
          unzip -l maalausmultivari-production-dist.zip | grep -q "index.html"
          if unzip -l maalausmultivari-production-dist.zip | grep -q "dist/index.html"; then
            echo "Nested dist directory detected" >&2
            exit 1
          fi

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: maalausmultivari-production-dist
          path: |
            maalausmultivari-production-dist.zip
            CPANEL-DEPLOYMENT.md
            TOOLS-AUDIT-REPORT.md
          if-no-files-found: error
          retention-days: 30
