name: Sync clean V15 image library

on:
  push:
    branches: [main]
    paths:
      - 'public/images.zip'
      - '.github/workflows/sync-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy image library with clean package
        run: |
          test -f public/images.zip
          rm -rf public/images
          unzip -o public/images.zip -d public
          test -d public/images
          echo "Clean image count: $(find public/images -type f | wc -l)"
          rm -f public/images.zip

      - name: Remove legacy image copies from generated dist
        run: |
          rm -rf dist/images

      - name: Install and verify application
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit synchronized V15 images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "V15: replace legacy images with clean optimized library"
          git push origin main
